<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semester - 1</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#000;
    color:#fff;
    padding:20px;
}

.container{
    max-width:450px;
    margin:auto;
}

/* Header */

.header{
    background:#111;
    border:2px solid #00cc44;
    border-radius:14px;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 0 12px rgba(0,204,68,.25);
    margin-bottom:25px;
}

.subtitle{
    color:#00cc44;
    font-size:14px;
    margin-bottom:6px;
}

.title{
    font-size:28px;
    font-weight:bold;
}

.header i{
    color:#00cc44;
    font-size:45px;
}

/* Sections */

.section{
    background:#111;
    border:2px solid #00cc44;
    border-radius:12px;
    padding:18px;
    margin-bottom:22px;
}

.section h2{
    color:#00cc44;
    font-size:20px;
    margin-bottom:5px;
}

.section p.sub{
    color:#bfbfbf;
    font-size:13px;
    margin-bottom:18px;
}

/* Info */

.info{
    margin:12px 0;
    font-size:16px;
}

.label{
    color:#00cc44;
    font-weight:bold;
}

.value{
    color:#fff;
    font-weight:bold;
}

/* Theory Practical */

.partition{
    display:flex;
    gap:15px;
    margin-bottom:18px;
}

.box{
    flex:1;
    border:1.8px solid #00cc44;
    border-radius:10px;
    padding:15px;
}

.box h3{
    color:#00cc44;
    text-align:center;
    margin-bottom:12px;
}

/* Total */

.total{
    border-top:2px solid #00cc44;
    padding-top:15px;
    font-size:18px;
}

/* Buttons */

.buttons{
    display:grid;
    gap:14px;
    margin-top:10px;
}

.buttons a{
   background:#000;
    color:#00cc44;
    text-decoration:none;
    text-align:center;
    padding:15px;
    border-radius:10px;
    font-size:17px;
    font-weight:bold;
    border:2px solid #00cc44;
    transition:.25s;
}

.buttons a:hover{
    
     background:#00cc44;
    color:#000;
}
</style>

</head>
<body>

<div class="container">

<!-- Header -->

<div class="header">

<div>
<div class="subtitle">Diploma In ECE</div>
<div class="title">Fundamentals of Electronics (FOE) </div>

<br>

<div class="subtitle">Subject Code : DI01000051</div>

<br>
<br>

<div class="section">

    <h2>Resources : GTU</h2>

</div>

<!-- Buttons -->

<div class="buttons">

</div>

</div>

</body>
</html>
