<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diploma In ECE</title>
 <link 
    rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#000;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
}

/* Top Container */
.header{
    background:#111;
    border:2px solid #00cc44;
    border-radius:14px;
    padding:20px;
    margin-bottom:30px;
    box-shadow:0 0 12px rgba(0,204,68,.25);

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header-text{
    text-align:left;
}

.subtitle{
    color:#00cc44;
    font-size:15px;
    margin-bottom:8px;
    letter-spacing:1px;
}

.title{
    color:#fff;
    font-size:34px;
    font-weight:bold;
}


/* Adjustable icon size */
.header-icon{
    color:#00cc44;
    font-size:48px;   /* Change this to any size (32px, 40px, 60px, etc.) */
}


/* Semester Buttons */
.semester-btn{
    display:block;
    width:100%;
      background:#000;
    color:#fefffe;
    text-decoration:none;
    text-align:center;
    padding:16px;
    margin:14px 0;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    border:2px solid #00cc44;
    transition:.25s;
    
}

.semester-btn:hover{
     background:#00cc44;
    color:#000;
}

.semester-btn:active{
    transform:scale(.98);
}
</style>
</head>

<body>

<div class="container">

  <div class="header">

    <div class="header-text">
        <div class="subtitle">After 10th</div>
        <div class="title">Diploma In ECE</div>
    </div>

    <i class="fa-solid fa-tower-cell header-icon"></i>

</div>

    <a href="semester1.html" class="semester-btn">Semester 1</a>

    <a href="WorkInProgress.html" class="semester-btn">Semester 2</a>

    <a href="WorkInProgress.html" class="semester-btn">Semester 3</a>

    <a href="WorkInProgress.html" class="semester-btn">Semester 4</a>

    <a href="WorkInProgress.html" class="semester-btn">Semester 5</a>

    <a href="WorkInProgress.html" class="semester-btn">Semester 6</a>

</div>

</body>
</html>
