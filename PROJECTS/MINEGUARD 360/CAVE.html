/* =========================================================
   CAMERA LOOK SYSTEM
   ========================================================= */

let yaw = 0;
let pitch = 0;

const lookSensitivity =
    isAndroid ? 0.005 : 0.0025;


/* =========================================================
   ANDROID TOUCH LOOK
   ========================================================= */

let touchLooking = false;

let previousTouchX = 0;
let previousTouchY = 0;


renderer.domElement.addEventListener(
    "touchstart",
    function(event) {

        if(!isAndroid) return;

        // Ignore touches on movement buttons
        if(event.target.closest(".mobileButton"))
            return;

        if(event.touches.length !== 1)
            return;

        touchLooking = true;

        previousTouchX =
            event.touches[0].clientX;

        previousTouchY =
            event.touches[0].clientY;

    },
    { passive: false }
);


renderer.domElement.addEventListener(
    "touchmove",
    function(event) {

        if(!isAndroid)
            return;

        if(!touchLooking)
            return;

        if(event.touches.length !== 1)
            return;

        event.preventDefault();

        const touch =
            event.touches[0];

        const dx =
            touch.clientX -
            previousTouchX;

        const dy =
            touch.clientY -
            previousTouchY;


        yaw -= dx * lookSensitivity;

        pitch -= dy * lookSensitivity;


        // Prevent camera flipping
        pitch = Math.max(
            -Math.PI / 2 + 0.01,
            Math.min(
                Math.PI / 2 - 0.01,
                pitch
            )
        );


        previousTouchX =
            touch.clientX;

        previousTouchY =
            touch.clientY;

    },
    { passive: false }
);


renderer.domElement.addEventListener(
    "touchend",
    function() {

        touchLooking = false;

    }
);


/* =========================================================
   WINDOWS / DESKTOP POINTER LOCK
   ========================================================= */

let pointerLocked = false;


if(isDesktop) {

    renderer.domElement.addEventListener(
        "click",
        function() {

            renderer.domElement.requestPointerLock();

        }
    );


    document.addEventListener(
        "pointerlockchange",
        function() {

            pointerLocked =
                document.pointerLockElement ===
                renderer.domElement;

        }
    );


    document.addEventListener(
        "mousemove",
        function(event) {

            if(!pointerLocked)
                return;


            yaw -=
                event.movementX *
                lookSensitivity;

            pitch -=
                event.movementY *
                lookSensitivity;


            pitch = Math.max(
                -Math.PI / 2 + 0.01,
                Math.min(
                    Math.PI / 2 - 0.01,
                    pitch
                )
            );

        }
    );

}

/* =========================================================
   ANDROID BUTTON SYSTEM
   ========================================================= */

function setupButton(
    id,
    keyName
) {

    const button =
        document.getElementById(id);


    button.addEventListener(
        "touchstart",
        function(event) {

            event.preventDefault();

            keys[keyName] = true;

        },
        { passive: false }
    );


    button.addEventListener(
        "touchend",
        function(event) {

            event.preventDefault();

            keys[keyName] = false;

        },
        { passive: false }
    );


    button.addEventListener(
        "touchcancel",
        function() {

            keys[keyName] = false;

        }
    );


    // Also works with mouse if testing mobile
    button.addEventListener(
        "mousedown",
        function() {

            keys[keyName] = true;

        }
    );


    button.addEventListener(
        "mouseup",
        function() {

            keys[keyName] = false;

        }
    );

}

/* =========================================================
   MOVEMENT FUNCTION
   ========================================================= */

const moveSpeed = 0.50  ;


function updateMovement() {

    // Forward direction based on camera yaw
    const forwardX =
        -Math.sin(yaw);

    const forwardZ =
        -Math.cos(yaw);


    // Right direction
    const rightX =
        Math.cos(yaw);

    const rightZ =
        -Math.sin(yaw);


    if(keys.forward) {

        camera.position.x +=
            forwardX * moveSpeed;

        camera.position.z +=
            forwardZ * moveSpeed;

    }


    if(keys.backward) {

        camera.position.x -=
            forwardX * moveSpeed;

        camera.position.z -=
            forwardZ * moveSpeed;

    }


    if(keys.left) {

        camera.position.x -=
            rightX * moveSpeed;

        camera.position.z -=
            rightZ * moveSpeed;

    }


    if(keys.right) {

        camera.position.x +=
            rightX * moveSpeed;

        camera.position.z +=
            rightZ * moveSpeed;

    }


    if(keys.up) {

        camera.position.y +=
            moveSpeed;

    }


    if(keys.down) {

        camera.position.y -=
            moveSpeed;

    }


    // Prevent going below ground
    if(camera.position.y < 1) {

        camera.position.y = 1;

    }

}


/* =========================================================
   CAMERA ROTATION
   ========================================================= */

function updateCamera() {

    camera.rotation.order =
        "YXZ";

    camera.rotation.y =
        yaw;

    camera.rotation.x =
        pitch;

}

// ---- Sun core (glowing sphere with noisy shader surface) ----
var sunShaderMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 }
  },
  vertexShader: [
    "varying vec3 vPos;",
    "void main() {",
    "  vPos = position;",
    "  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);",
    "}"
  ].join("\n"),
  fragmentShader: [
    "uniform float uTime;",
    "varying vec3 vPos;",
    "",
    "float hash(vec3 p) {",
    "  return fract(sin(dot(p, vec3(12.9898, 78.233, 45.164))) * 43758.5453);",
    "}",
    "",
    "float noise(vec3 p) {",
    "  vec3 i = floor(p);",
    "  vec3 f = fract(p);",
    "  f = f * f * (3.0 - 2.0 * f);",
    "  float n000 = hash(i);",
    "  float n100 = hash(i + vec3(1.0, 0.0, 0.0));",
    "  float n010 = hash(i + vec3(0.0, 1.0, 0.0));",
    "  float n110 = hash(i + vec3(1.0, 1.0, 0.0));",
    "  float n001 = hash(i + vec3(0.0, 0.0, 1.0));",
    "  float n101 = hash(i + vec3(1.0, 0.0, 1.0));",
    "  float n011 = hash(i + vec3(0.0, 1.0, 1.0));",
    "  float n111 = hash(i + vec3(1.0, 1.0, 1.0));",
    "  float nx00 = mix(n000, n100, f.x);",
    "  float nx10 = mix(n010, n110, f.x);",
    "  float nx01 = mix(n001, n101, f.x);",
    "  float nx11 = mix(n011, n111, f.x);",
    "  float nxy0 = mix(nx00, nx10, f.y);",
    "  float nxy1 = mix(nx01, nx11, f.y);",
    "  return mix(nxy0, nxy1, f.z);",
    "}",
    "",
    "float fbm(vec3 p) {",
    "  float total = 0.0;",
    "  float amp = 0.5;",
    "  for (int i = 0; i < 5; i++) {",
    "    total += noise(p) * amp;",
    "    p = p * 2.0;",
    "    amp = amp * 0.5;",
    "  }",
    "  return total;",
    "}",
    "",
    "void main() {",
    "  vec3 p = vPos * 2.5 + vec3(0.0, 0.0, uTime * 0.15);",
    "  float n = fbm(p + vec3(uTime * 0.1, 0.0, 0.0));",
    "",
    "  vec3 colorDeep = vec3(1.0, 0.7, 0.1);",
    "  vec3 colorMid = vec3(1.0, 0.85, 0.3);",
    "  vec3 colorHot = vec3(1.0, 0.98, 0.85);",
    "",
    "  vec3 color = mix(colorDeep, colorMid, smoothstep(0.3, 0.6, n));",
    "  color = mix(color, colorHot, smoothstep(0.65, 0.9, n));",
    "",
    "  gl_FragColor = vec4(color, 1.0);",
    "}"
  ].join("\n")
});

var sunGeo = new THREE.SphereGeometry(2, 64, 64);
var sun = new THREE.Mesh(sunGeo, sunShaderMaterial);
sun.position.set(-500,200,0);
sun.scale.set(10,10,10);

// ---- Glow halo using a canvas-generated radial gradient sprite ----
function createGlowTexture() {
  var canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 256;
  var ctx = canvas.getContext('2d');
  var gradient = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  gradient.addColorStop(0.0, 'rgba(255, 255, 240, 1.0)');
  gradient.addColorStop(0.2, 'rgba(255, 240, 150, 0.8)');
  gradient.addColorStop(0.45, 'rgba(255, 220, 80, 0.35)');
  gradient.addColorStop(0.75, 'rgba(255, 200, 50, 0.1)');
  gradient.addColorStop(1.0, 'rgba(255, 180, 0, 0.0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(canvas);
}

var glowTexture = createGlowTexture();

// Inner tight bright glow
var glowMaterialInner = new THREE.SpriteMaterial({
  map: glowTexture,
  color: 0xffffff,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
var glowSpriteInner = new THREE.Sprite(glowMaterialInner);
glowSpriteInner.position.set(-500,200,0);
glowSpriteInner.scale.set(60, 60, 10);
scene.add(glowSpriteInner);

// Outer soft wide glow (adds the "glowing from a distance" haze)
var glowMaterialOuter = new THREE.SpriteMaterial({
  map: glowTexture,
  color: 0xfff2b0,

  transparent: true,
  opacity: 0.6,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
var glowSpriteOuter = new THREE.Sprite(glowMaterialOuter);
glowSpriteOuter.position.set(-500,200,0);
glowSpriteOuter.scale.set(140, 140, 10);
scene.add(glowSpriteOuter);

// ---- Point light so it feels like an emissive light source ----
var sunLight = new THREE.PointLight(0xfff2cc, 2, 100);
scene.add(sunLight);
