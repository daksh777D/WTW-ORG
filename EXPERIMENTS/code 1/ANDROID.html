<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mobile 3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <style>
    body {
      margin: 0;
      overflow: hidden;
      touch-action: none;
      background: black;
    }

    /* UI buttons */
    .controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      display: grid;
      grid-template-columns: 60px 60px 60px;
      grid-template-rows: 60px 60px;
      gap: 10px;
    }

    .btn {
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 20px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }

    .btn:active {
      background: rgba(255,255,255,0.5);
    }

    .up    { grid-column: 2; grid-row: 1; }
    .left  { grid-column: 1; grid-row: 2; }
    .down  { grid-column: 2; grid-row: 2; }
    .right { grid-column: 3; grid-row: 2; }
    
    .flyup {
  position: absolute;
  right: 20px;
  bottom: 100px;
  width: 60px;
  height: 60px;
}

.flydown {
  position: absolute;
  right: 20px;
  bottom: 20px;
  width: 60px;
  height: 60px;
}
  </style>
</head>
<body>

<!-- MOVEMENT BUTTONS -->
<div class="controls">
  <div class="btn up">▲</div>
  <div class="btn left">◀</div>
  <div class="btn down">▼</div>
  <div class="btn right">▶</div>
  <div class="btn flyup">⤊</div>
<div class="btn flydown">⤋</div>
</div>

<!-- IMPORT MAP -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/loaders/GLTFLoader.js';

// --------------------
// SCENE
// --------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb); // sky blue
// --------------------
// CAMERA
// --------------------
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 1.6, 5);

// --------------------
// RENDERER
// --------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// --------------------
// LIGHT
// --------------------
// Ambient light (soft global light)
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

// Sun light (VERY IMPORTANT)
const sun = new THREE.DirectionalLight(0xffffff, 4.0);
sun.position.set(10, 20, 10);
scene.add(sun);
// --------------------
// LOAD GLB
// --------------------
new GLTFLoader().load(
  'scene.glb',
  (gltf) => {
    gltf.scene.scale.set(1,1,1);
    scene.add(gltf.scene);
  },
  undefined,
  (e) => console.error(e)
);



// --------------------
// TOUCH LOOK
// --------------------
let yaw = 0;
let pitch = 0;
let lastX = 0;
let lastY = 0;
let touching = false;

document.addEventListener('touchstart', e => {
  touching = true;
  lastX = e.touches[0].clientX;
  lastY = e.touches[0].clientY;
});

document.addEventListener('touchend', () => touching = false);

document.addEventListener('touchmove', e => {
  if (!touching) return;

  const x = e.touches[0].clientX;
  const y = e.touches[0].clientY;

  yaw   -= (x - lastX) * 0.005;
  pitch -= (y - lastY) * 0.005;
  pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));

  camera.rotation.set(pitch, yaw, 0);

  lastX = x;
  lastY = y;
});

// --------------------
// BUTTON MOVEMENT
// --------------------

const move = { f:0, b:0, l:0, r:0 ,u:0 , d:0 };
const speed = 12;

function bind(btn, key) {
  btn.addEventListener('touchstart', e => { e.preventDefault(); move[key]=1; });
  btn.addEventListener('touchend',   e => { e.preventDefault(); move[key]=0; });
}

bind(document.querySelector('.up'),    'f');
bind(document.querySelector('.down'),  'b');
bind(document.querySelector('.left'),  'l');
bind(document.querySelector('.right'), 'r');
bind(document.querySelector('.flyup'), 'u');
bind(document.querySelector('.flydown'), 'd');
// --------------------
// LOOP
// --------------------
const dir = new THREE.Vector3();
let last = performance.now();

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  const dt = (now - last) / 1000;

  dir.set(
  move.r - move.l,
  move.u - move.d,
  move.b - move.f
);

  if (dir.length() > 0) {
    dir.normalize().multiplyScalar(speed * dt);
    dir.applyEuler(camera.rotation);
    camera.position.add(dir);
  }

  renderer.render(scene, camera);
  last = now;
}
animate();

// --------------------
// RESIZE
// --------------------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
